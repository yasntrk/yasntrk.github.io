name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

# NOTE: keep every action on a major that runs on Node 24. The older majors
# (checkout@v4, withastro/action@v3, deploy-pages@v4) still ran, but GitHub
# flagged each run with a "Node.js 20 is deprecated" warning and will stop
# forcing them onto Node 24 eventually. withastro/action@v6 also drags its own
# internals (setup-node, upload-pages-artifact) up to Node-24 versions, which is
# where the rest of those warnings came from.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build Astro site
        uses: withastro/action@v6
        # with:
        #   node-version: 24   # optional override (v6 already defaults to 24)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
